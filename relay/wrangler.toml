# Cloudflare Workers deployment of the Bonvoyage relay. See ../README.md.
name = "bonvoyage-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The relay must not keep request logs: they would hold client addresses.
[observability]
enabled = false

[vars]
# RELAY_HOST = "relay.example" # optional here: Cloudflare only routes your own host names to the Worker
REGISTRATION = "open" # "invite" asks new inboxes for INVITE_CODE (set it with `wrangler secret put INVITE_CODE`); "closed" refuses them

[[d1_databases]]
binding = "DB"
database_name = "bonvoyage"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# The landing page, the rendered spec and the test vectors (built by `npm run build:site`).
# Files here are served directly; everything else goes to the relay code.
[assets]
directory = "./public"
# Only /v1 reaches the relay code. Every other path is answered from the static
# files (or their 404 page) without running the Worker, so it cannot be used to
# use up the plan's request allowance.
run_worker_first = ["/v1", "/v1/*"]
not_found_handling = "404-page"

# At most this many relay requests per IP address per minute, per Cloudflare location.
# A printer polling every 30 seconds makes 2. namespace_id is any integer unique in your account.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7341"

  [ratelimits.simple]
  limit = 180
  period = 60

# Daily cleanup of expired messages and long-unused inboxes.
[triggers]
crons = ["17 3 * * *"]

# Serve it on your own domain (the zone must be in the same Cloudflare account):
# [[routes]]
# pattern = "bonvoyage.example.com"
# custom_domain = true
