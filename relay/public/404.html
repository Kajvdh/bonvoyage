<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | Bonvoyage</title>
<style>
:root {
  --paper:#f5f2ea; --card:#fffdf8; --ink:#1c1b18; --soft:#5f5b52; --line:#ddd7c9; --accent:#d9480f; --accent-ink:#fff;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper:#151410; --card:#1e1d18; --ink:#ece8dd; --soft:#a7a294; --line:#34322b; --accent:#ff7a3d; --accent-ink:#1a0d05; }
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px; }
a:hover { color:var(--accent); }
.wrap { max-width:1060px; margin:0 auto; padding:0 24px; }
header.top { display:flex; align-items:center; gap:24px; padding:22px 0; }
.mark { font:700 18px var(--mono); letter-spacing:.14em; text-decoration:none; }
.mark b { color:var(--accent); font-weight:700; }
header.top nav { margin-left:auto; display:flex; gap:22px; font-size:15px; }
header.top nav a { text-decoration:none; color:var(--soft); }
header.top nav a:hover { color:var(--ink); }
.eyebrow { font:600 12.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 14px; }
h1 { font-size:clamp(38px, 6vw, 62px); line-height:1.04; letter-spacing:-.025em; margin:0 0 22px; font-weight:750; }
h2 { font-size:clamp(27px, 3.6vw, 36px); line-height:1.15; letter-spacing:-.02em; margin:0 0 14px; }
h3 { font-size:18px; margin:0 0 6px; }
p { margin:0 0 16px; }
.lead { font-size:20px; color:var(--soft); max-width:34em; }
section { padding:76px 0; border-top:1px solid var(--line); }
.hero { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:56px; align-items:center; padding:48px 0 84px; }
.buttons { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; }
.btn { display:inline-block; padding:13px 22px; border-radius:10px; font-weight:600; text-decoration:none; border:1.5px solid var(--ink); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover { filter:brightness(1.08); color:var(--accent-ink); }
.btn:hover { border-color:var(--accent); }

/* the ticket */
.ticket { justify-self:center; width:min(100%, 330px); background:#fffef9; color:#1c1b18; font:14.5px/1.45 var(--mono); padding:26px 22px 34px; transform:rotate(2.2deg);
  box-shadow:0 1px 0 rgba(0,0,0,.05), 0 18px 40px -12px rgba(0,0,0,.35);
  --z:9px; -webkit-mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x, linear-gradient(#000 0 0) top/100% 51% no-repeat;
          mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x, linear-gradient(#000 0 0) top/100% 51% no-repeat; }
.ticket .big { font-size:25px; font-weight:800; text-align:center; letter-spacing:.06em; }
.ticket .c { text-align:center; }
.ticket hr { border:0; border-top:1.5px dashed #1c1b18; margin:11px 0; opacity:.75; }
.ticket .inv { background:#1c1b18; color:#fffef9; padding:1px 8px; }
.ticket .row { display:flex; justify-content:space-between; gap:8px; }
.ticket .dim { opacity:.6; }
.ticket svg { display:block; margin:10px auto 4px; }

/* how it works */
.flow { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:14px; align-items:stretch; margin:36px 0 12px; }
.node { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
.node .tag { font:600 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--soft); }
.node strong { display:block; font-size:19px; margin:4px 0 6px; }
.node p { font-size:15px; color:var(--soft); margin:0; }
.node.relay { border-style:dashed; }
.arrow { align-self:center; color:var(--accent); font:700 13px var(--mono); text-align:center; white-space:nowrap; }
.arrow span { display:block; font-size:26px; line-height:1; }
ol.steps { counter-reset:s; list-style:none; padding:0; margin:34px 0 0; display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; }
ol.steps li { counter-increment:s; }
ol.steps li::before { content:counter(s, decimal-leading-zero); font:700 14px var(--mono); color:var(--accent); display:block; margin-bottom:8px; }
ol.steps p { color:var(--soft); font-size:16px; margin:0; }

.grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; margin-top:34px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
.card p { color:var(--soft); margin:0; font-size:16px; }
.card .ico { font-size:26px; display:block; margin-bottom:10px; }

.sees { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:30px; }
.sees ul { list-style:none; padding:0; margin:12px 0 0; }
.sees li { padding:9px 0 9px 30px; position:relative; border-top:1px solid var(--line); font-size:16px; }
.sees li::before { position:absolute; left:2px; font-weight:700; }
.never li::before { content:"\2715"; color:var(--accent); }
.does li::before { content:"\25CB"; color:var(--soft); }
.sees small { color:var(--soft); }

.two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:44px; align-items:start; }
pre { background:#16150f; color:#ece8dd; border-radius:14px; padding:20px 22px; overflow-x:auto; font:14px/1.55 var(--mono); margin:0; border:1px solid #2c2a23; }
pre .k { color:#ff9d6b; } pre .s { color:#b9d28a; } pre .c { color:#8d887a; }
code { font:.9em var(--mono); background:color-mix(in srgb, var(--ink) 8%, transparent); padding:2px 6px; border-radius:5px; }
pre code { background:none; padding:0; font-size:inherit; }
ul.check { list-style:none; padding:0; margin:18px 0 0; }
ul.check li { padding:8px 0 8px 30px; position:relative; }
ul.check li::before { content:"\2192"; position:absolute; left:2px; color:var(--accent); font-weight:700; }
.links { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.links a { font:600 14px var(--mono); padding:9px 14px; border:1px solid var(--line); border-radius:9px; text-decoration:none; background:var(--card); }
.links a:hover { border-color:var(--accent); }

dl.limits { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin:28px 0 0; }
dl.limits div { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
dl.limits dt { font:600 11.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
dl.limits dd { margin:4px 0 0; font-size:22px; font-weight:700; }
.host { font-family:var(--mono); color:var(--accent); }
footer { border-top:1px solid var(--line); padding:30px 0 50px; color:var(--soft); font-size:14.5px; display:flex; flex-wrap:wrap; gap:8px 24px; }
footer span:first-child { font-family:var(--mono); letter-spacing:.1em; }

.corner { position:absolute; top:0; right:0; z-index:5; }
.corner svg { fill:var(--ink); color:var(--paper); display:block; }
.corner:hover .arm { animation:wave .56s ease-in-out; }
.corner .arm { transform-origin:130px 106px; }
@keyframes wave { 0%,100% { transform:rotate(0); } 20%,60% { transform:rotate(-25deg); } 40%,80% { transform:rotate(10deg); } }
header.top { padding-right:64px; }
.tabs { display:flex; gap:8px; margin:26px 0 0; flex-wrap:wrap; }
.path { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px; }
.path h3 { font-size:20px; }
.path .who { font:600 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px; }
.path p { color:var(--soft); font-size:16px; }
.path pre { margin-top:14px; }
.explain { border-left:3px solid var(--accent); padding:4px 0 4px 18px; margin:22px 0 0; color:var(--soft); font-size:16px; }
.explain b { color:var(--ink); }
blockquote.prompt { margin:14px 0 0; padding:16px 18px; background:color-mix(in srgb, var(--accent) 9%, var(--card)); border:1px dashed var(--accent); border-radius:12px; font:14.5px/1.55 var(--mono); }
@media (max-width: 860px) {
  .hero { grid-template-columns:1fr; gap:40px; padding-top:24px; }
  .flow { grid-template-columns:1fr; } .arrow span { transform:rotate(90deg); display:inline-block; }
  ol.steps, .grid, .sees, .two { grid-template-columns:1fr; }
  dl.limits { grid-template-columns:repeat(2, 1fr); }
  header.top nav a:not(.keep) { display:none; }
  .corner svg { width:62px; height:62px; }
  section { padding:56px 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="mark" href="/">BON<b>VOYAGE</b></a></header>
<main style="padding:70px 0 120px">
  <p class="eyebrow">404</p>
  <h1>This ticket got lost.</h1>
  <p class="lead">There is nothing at this address. The relay lives under <code>/v1</code>; everything else is on the <a href="/">front page</a>.</p>
</main>
</div>
</body>
</html>
